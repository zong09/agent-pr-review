# ตัวอย่าง caller สำหรับ TypeScript full-stack (React ฝั่งหน้า + NestJS/TypeORM ฝั่งหลัง)
# วางที่ .github/workflows/ai-review.yml ใน repo ปลายทาง แล้วแก้ OWNER
#
# ต่างจาก examples/caller.yml ตรงที่ชุด default เป็น checklist กลาง ๆ
# ส่วนชุดนี้เพิ่มสามกลุ่มที่ชุดกลางมองไม่เห็น และเป็นกลุ่มที่บั๊กแพงที่สุด
# ในแอปที่มีผู้ใช้หลายคนและเกี่ยวกับเงิน:
#   - การ scope ข้อมูลตามผู้ใช้ (บั๊กทีเดียวคือข้อมูลรั่วข้ามบัญชี)
#   - การแปลงสกุลเงิน (ลืมแปลงกับแปลงซ้ำ อาการเหมือนกันคือตัวเลขผิดเงียบ ๆ)
#   - การใช้ AES-GCM (IV ซ้ำหรือไม่ตรวจ auth tag ทำให้การเข้ารหัสไร้ผล)
#
# ⚠️ ลำดับข้อควรเรียงตามความเสี่ยงจริงของ repo คุณ ไม่ใช่ลอกชุดนี้ไปทั้งดุ้น
# วิธีที่ได้ผลคือ grep ดูก่อนว่าโค้ดใช้อะไรจริง แล้วดันข้อที่ตรงขึ้นบน

name: AI Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  ai-review:
    uses: OWNER/agent-pr-review/.github/workflows/pr-review.yml@main
    secrets:
      DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}
    with:
      extra_instructions: |
        โปรเจกต์นี้เป็น TypeScript full-stack (React ฝั่งหน้า NestJS + TypeORM ฝั่งหลัง)
        เป็นแอปหลายผู้ใช้ที่จัดการข้อมูลการเงิน
        ตรวจตามรายการนี้ทีละข้อ รายงานเฉพาะข้อที่พบจริง พร้อมชื่อฟังก์ชันและบรรทัด:
        (1) query ที่ไม่ได้กรองด้วย id ของผู้ใช้ที่ล็อกอินอยู่ หรือ endpoint ที่ลืมใส่ guard
            ทำให้ผู้ใช้คนหนึ่งเห็นหรือแก้ข้อมูลของอีกคนได้
        (2) ใช้ number (float64) กับจำนวนเงิน แทนการเก็บเป็นจำนวนเต็มหน่วยย่อย
            หรือ decimal library รวมถึงการบวกลบคูณราคาหลายทอดแล้วปัดเศษท้ายเดียว
        (3) แปลงสกุลเงินผิด — นำค่าคนละสกุลมาบวกกันโดยไม่แปลง หรือแปลงซ้ำสองรอบ
            หรือเก็บค่าที่แปลงแล้วลง DB จนไม่รู้ว่าค่าไหนเป็นสกุลอะไร
        (4) เรียก async function โดยไม่ใส่ await โดยเฉพาะก่อนนำผลไปเปรียบเทียบหรือคำนวณ
            และ promise ที่ไม่มีใครรอหรือไม่มี catch
        (5) catch ที่ว่างเปล่าหรือกลืน error โดยไม่ log และไม่ rethrow
            โดยเฉพาะรอบการดึงราคา ซึ่งจะทำให้ราคาเก่าถูกแสดงเหมือนเป็นราคาปัจจุบัน
        (6) ใช้ AES-GCM โดย IV/nonce ซ้ำกับคีย์เดิม หรือถอดรหัสโดยไม่ตรวจ auth tag
        (7) หารด้วยค่าที่อาจเป็นศูนย์ เช่น มูลค่ารวมพอร์ตตอนยังไม่มีรายการ
            ในการคำนวณสัดส่วนหรือเปอร์เซ็นต์การเปลี่ยนแปลง
        (8) React: dependency ของ useEffect ผิดหรือขาด ทำให้เกิด stale closure
            effect ที่ไม่มี cleanup ทำให้ polling ราคาซ้อนกัน และการ mutate state ตรง ๆ
        (9) สร้าง SQL ด้วยการต่อ string หรือส่งค่าจากผู้ใช้เข้า raw query โดยไม่ bind
        (10) ค่า secret เช่น API key, JWT secret, encryption key ที่ hardcode หรือ commit ขึ้น repo
